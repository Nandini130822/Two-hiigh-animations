<section class="jc" data-jc>
  <div class="jc__stage">
    <div class="jc__eyebrow">The Jacket Collection</div>

    <div class="jc__model">
      <img src="jacket-carousel/assets/model-vest.webp" alt="Model">
    </div>

    <div class="jc__carousel">
      <div class="jc__item">
        <img src="jacket-carousel/assets/tee1.webp?v=3" alt="Piece 01">
        <img class="jc__back" src="jacket-carousel/assets/tee1-back.webp?v=3" alt="" aria-hidden="true">
      </div>
      <div class="jc__item">
        <img src="jacket-carousel/assets/tee2.webp?v=3" alt="Piece 02">
        <img class="jc__back" src="jacket-carousel/assets/tee2-back.webp?v=3" alt="" aria-hidden="true">
      </div>
      <div class="jc__item">
        <img src="jacket-carousel/assets/tee3.webp?v=3" alt="Piece 03">
        <img class="jc__back" src="jacket-carousel/assets/tee3-back.webp?v=3" alt="" aria-hidden="true">
      </div>
      <div class="jc__item">
        <img src="jacket-carousel/assets/tee4.webp?v=3" alt="Piece 04">
        <img class="jc__back" src="jacket-carousel/assets/tee4-back.webp?v=3" alt="" aria-hidden="true">
      </div>
      <div class="jc__item">
        <img src="jacket-carousel/assets/tee5.webp?v=3" alt="Piece 05">
        <img class="jc__back" src="jacket-carousel/assets/tee5-back.webp?v=3" alt="" aria-hidden="true">
      </div>
    </div>

    <div class="jc__label">Piece 01</div>

    <div class="jc__counter">
      <span class="jc__current">01</span>
      <span class="jc__counter-line"></span>
      <span class="jc__counter-total">05</span>
    </div>
  </div>
</section>
