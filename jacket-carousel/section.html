<!-- =========================================================
     TWO HIIGH "Jacket Collection" carousel — paste where it goes.
     Paths assume the "jacket-carousel" folder sits next to your page.
     ========================================================= -->
<section class="jc" data-jc>
  <div class="jc__stage">
    <div class="jc__eyebrow">The Jacket Collection</div>

    <div class="jc__copy">
      <h1>The Jacket<br> Collection</h1>
      <p>Designed for movement.<br>Built for every moment.</p>
    </div>

    <div class="jc__model">
      <img class="jc__look" src="jacket-carousel/assets/look1.webp" alt="Model wearing piece 01">
      <img class="jc__look" src="jacket-carousel/assets/look2.webp" alt="Model wearing piece 02">
      <img class="jc__look" src="jacket-carousel/assets/look3.webp" alt="Model wearing piece 03">
      <img class="jc__look" src="jacket-carousel/assets/look4.webp" alt="Model wearing piece 04">
      <img class="jc__look" src="jacket-carousel/assets/look5.webp" alt="Model wearing piece 05">
    </div>

    <div class="jc__carousel">
      <div class="jc__item"><img src="jacket-carousel/assets/flat1.webp" alt="Piece 01"></div>
      <div class="jc__item"><img src="jacket-carousel/assets/flat2.webp" alt="Piece 02"></div>
      <div class="jc__item"><img src="jacket-carousel/assets/flat3.webp" alt="Piece 03"></div>
      <div class="jc__item"><img src="jacket-carousel/assets/flat4.webp" alt="Piece 04"></div>
      <div class="jc__item"><img src="jacket-carousel/assets/flat5.webp" alt="Piece 05"></div>
    </div>

    <div class="jc__label">Piece 01</div>

    <div class="jc__counter">
      <span class="jc__current">01</span>
      <span class="jc__counter-line"></span>
      <span class="jc__counter-total">05</span>
    </div>
  </div>
</section>
