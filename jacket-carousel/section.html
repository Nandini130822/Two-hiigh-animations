<!-- =========================================================
     TWO HIIGH "Jacket Collection" carousel — paste where it goes.
     Paths assume the "jacket-carousel" folder sits next to your page.
     ========================================================= -->
<section class="jc" data-jc>
  <div class="jc__stage">
    <div class="jc__eyebrow">The Jacket Collection</div>

    <div class="jc__copy">
      <h1>The Jacket<br> Collection</h1>
      <p>Designed for movement.<br>Built for every moment.</p>
    </div>

    <div class="jc__model" role="img" aria-label="Model wearing the selected piece">
      <img class="jc__body" src="jacket-carousel/assets/body.webp?v=3" alt="">
    </div>

    <div class="jc__carousel">
      <div class="jc__item">
        <img class="jc__worn" src="jacket-carousel/assets/worn1.webp?v=5" alt="Piece 01">
      </div>
      <div class="jc__item">
        <img class="jc__worn" src="jacket-carousel/assets/worn2.webp?v=5" alt="Piece 02">
      </div>
      <div class="jc__item">
        <img class="jc__worn" src="jacket-carousel/assets/worn3.webp?v=5" alt="Piece 03">
      </div>
      <div class="jc__item">
        <img class="jc__worn" src="jacket-carousel/assets/worn4.webp?v=5" alt="Piece 04">
      </div>
      <div class="jc__item">
        <img class="jc__worn" src="jacket-carousel/assets/worn5.webp?v=5" alt="Piece 05">
      </div>
    </div>

    <div class="jc__front">
      <img src="jacket-carousel/assets/front.webp" alt="">
    </div>

    <div class="jc__label">Piece 01</div>

    <div class="jc__counter">
      <span class="jc__current">01</span>
      <span class="jc__counter-line"></span>
      <span class="jc__counter-total">05</span>
    </div>
  </div>
</section>
